server.port=8085
spring.application.name=exchange-api

# Main datasource - uses environment variables with defaults for development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/exchangex}
spring.datasource.username=${DB_USERNAME:exchangex}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable JPA/Hibernate - we use Spring JDBC
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# ============================================================
# Actuator & Observability Configuration
# ============================================================

# Expose health/info only. Prometheus must be explicitly enabled behind
# a trusted internal network or secured management endpoint.
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized

# Prometheus metrics
management.prometheus.metrics.export.enabled=true

# Micrometer metrics
management.metrics.enable.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.sla.http.server.requests=10ms,50ms,100ms,500ms,1s

# Enable metrics for database
management.metrics.enable.jdbc=true
management.metrics.distribution.percentiles-histogram.jdbc=true
management.metrics.distribution.percentiles.jdbc=0.5,0.95,0.99

# Custom metrics tags
management.metrics.tags.application=${spring.application.name}

# Health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Logging configuration
logging.pattern.correlationId=%X{traceId:-}%X{spanId:-}
logging.level.root=INFO
logging.level.com.exchangex.api=DEBUG