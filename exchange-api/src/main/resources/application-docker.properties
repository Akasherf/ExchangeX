# Exclusive to Docker Compose deployment. API remains on :8085; management on :9090.
# The management port is not published to the host and is not proxied by Nginx.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
exchangex.metrics.enabled=true
exchangex.stream.allowed-origins=${EXCHANGEX_STREAM_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
logging.level.com.exchangex.api=INFO
