# PostgreSQL integration test profile
# Uses the test database specified by environment variables

spring.datasource.url=${EXCHANGEX_TEST_DB_URL}
spring.datasource.username=${EXCHANGEX_TEST_DB_USERNAME}
spring.datasource.password=${EXCHANGEX_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable JPA/Hibernate for tests using Spring JDBC
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration