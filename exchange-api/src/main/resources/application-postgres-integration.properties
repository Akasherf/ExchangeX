# PostgreSQL integration test profile
# Uses the test database specified by environment variables

spring.datasource.url=${EXCHANGEX_TEST_DB_URL}
spring.datasource.username=${EXCHANGEX_TEST_DB_USERNAME}
spring.datasource.password=${EXCHANGEX_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable JPA/Hibernate for tests using Spring JDBC
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
# Legacy tests exercise pre-authentication endpoints; security has separate integration tests.
exchangex.security.enabled=false

# Existing pre-funding recovery and concurrency tests remain in legacy mode.
exchangex.trading.enforced=false
exchangex.multisymbol.enabled=false

# Disable background streaming in existing destructive PostgreSQL integration tests.
exchangex.stream.enabled=false

# Destructive test contexts directly construct/reinitialize coordinators.
exchangex.writer.guard.enabled=false
