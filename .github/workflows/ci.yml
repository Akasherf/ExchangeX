name: ExchangeX CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exchangex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Java 21 + real PostgreSQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exchangex_test
          POSTGRES_USER: exchangex
          POSTGRES_PASSWORD: ci_ephemeral_testing_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchangex -d exchangex_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      EXCHANGEX_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/exchangex_test
      EXCHANGEX_TEST_DB_USERNAME: exchangex
      EXCHANGEX_TEST_DB_PASSWORD: ci_ephemeral_testing_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven clean verify (includes PostgreSQL integration tests)
        run: mvn -B -ntp clean verify
      - name: Assert no skipped regression tests
        run: python3 scripts/check-test-reports.py
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: exchange-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: exchange-web/package-lock.json
      - name: Ensure committed lockfile
        run: test -f package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose-smoke:
    name: Docker Compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable Docker development credentials
        run: bash scripts/init-local-env.sh
      - name: Build and start all services
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Smoke-test UI, API, Prometheus and Grafana
        run: bash scripts/smoke-compose.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=180
      - name: Stop containers (retain no data on CI runner)
        if: always()
        run: docker compose down -v --remove-orphans
