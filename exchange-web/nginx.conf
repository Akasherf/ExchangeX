# Client-IP limits at the only externally published API entry point.
limit_req_zone $binary_remote_addr zone=exchangex_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=exchangex_register:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=exchangex_ws_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=exchangex_ws_conn:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Explicitly proxy only the public application API and WebSocket endpoint.
    # Do not proxy /actuator, /metrics, the API management port, or /grafana.
    location = /api/v1/auth/login {
        limit_req zone=exchangex_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/register {
        limit_req zone=exchangex_register burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /ws {
        limit_conn exchangex_ws_conn 10;
        limit_req zone=exchangex_ws_req burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
